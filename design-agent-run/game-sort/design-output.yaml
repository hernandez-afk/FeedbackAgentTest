# Step 10 — design output for GFE-SORT, revision 3 (after the author's round-3
# answers: stars on builds, pinned first; 40% confirmed; and audit round 2).
id: "GFE-SORT-design-3"
projectId: "GFE-SORT"
briefRef: "GFE-SORT"
scopeOverlapReportRef: "scope-overlap-report.yaml"
userFlowRef: "user-flow.yaml"
manifestVersion: "1.0.0"
supersedes: "GFE-SORT-design-2"
revisionNumber: 3
artifact:
  kind: "code"
  repo: "Atari-Inc/atari-game-feedback-engine"
  delivered: "game-sort.patch (5 commits)"
  screenshots: "screenshots/ (1440x900, 390x844, 320x700, and 320px at 200% text; local stack, seeded data)"
  reference: "reference-andreas-beijer/"

layout:
  shell: "Andreas Beijer's persistent left sidebar on /games AND every game dashboard: columns 1-3 of 12 from lg:, a drawer below lg:."
  sidebar: "Search → Sort (A to Z, Newest, Active, Critical*; note 'Starred builds always come first.') → Filters card (Platform, Project, Studio*) on /games only → Starred builds → Browse tree Project → Platform → Title → game, with a static star on games holding a starred build and a red '!'* on critical ones.  (*reviewers / when relevant)"
  pinning: "Games with a starred build come first on /games under every sort; sessions on a starred build come first on /sessions. The star toggle sits beside each build's Continue (BuildPills) and on each /sessions row."
  results: "Count line + View (Cards | List), removable chips, then the grid or list. Versions of one title collapse into one tile/row."

decisionLog:
  - { id: "D1", decision: "Search and sort state, and the pending state", chosen: "URL state + router.replace + dimmed grid (CH-606).", alternativesConsidered: [], mode: "inherited" }
  - { id: "D2", decision: "How filters open on phones", chosen: "Phone: slide-in drawer (modal dialog) instead of the round-1 inline panel.", alternativesConsidered: [], mode: "human-approved", rationale: "Author: 'whatever is most functional'. With a full tree in the sidebar, inline would push the list a screen down.", revises: "design-1 D2" }
  - { id: "D5", decision: "What 'Most active' means", chosen: "'Most active' = sessions in 30 days, on /games.", alternativesConsidered: [], mode: "human-approved", rationale: "author answer" }
  - { id: "D8", decision: "How versions of one game are grouped", chosen: "Option A: Title (franchise) above games.", alternativesConsidered: [], mode: "human-approved", rationale: "author answer" }
  - { id: "D9", decision: "How platform names are matched", chosen: "Platforms compare case-insensitively.", alternativesConsidered: [], mode: "human-approved", rationale: "author answer" }
  - { id: "D10", decision: "Sidebar layout", chosen: "Sidebar layout, sort row and tree follow Andreas Beijer's design.", alternativesConsidered: [], mode: "human-approved", rationale: "author-supplied reference" }
  - { id: "D11", decision: "When a game is flagged 'Critical'", chosen: "Critical = latest sentiment report >= 40% negative over >= 5 reviews; reviewers only.", alternativesConsidered: [], mode: "human-approved", rationale: "author answer: 'yes 40 is ok'; Reuses the dashboard's existing sentiment (no new AI call). Needs an enrichment run to have data." }
  - { id: "D12", decision: "What a star is attached to", chosen: "Stars are per BUILD, per user. Starred builds pin their game first on /games and their sessions first on /sessions, whatever the sort. The 'Starred' sort is removed because pinning makes it redundant.", alternativesConsidered: [], mode: "human-approved", rationale: "author answer: 'star whatever builds you want, that will be shown first in games and game sessions'", revises: "design-2 D12 (stars per game)" }
  - { id: "D13", decision: "Sort button labels", chosen: "Sort buttons show icon + word, not icons alone.", alternativesConsidered: [], mode: "auto-applied", rationale: "Deviates from the sketch's bare icons for Wickens 5/11." }
  - { id: "D14", decision: "How a title group sits in the card grid", chosen: "Collapsed title group = one card slot; expanded = full row.", alternativesConsidered: [], mode: "auto-applied", rationale: "A permanently full-row group left empty cells." }

glanceTest:
  - { surface: "/games", breakpoint: "sm", firstThings: ["'Games' heading", "Browse & filter", "first game card (starred first)"], pass: true, evidence: "screenshots/phone-01-games.png" }
  - { surface: "/sessions", breakpoint: "lg", firstThings: ["'Sessions' heading", "filter row incl. Platform", "first row (a starred build's session, star filled)"], pass: true, evidence: "screenshots/desktop-05-sessions-starred-pinned.png" }
  - { surface: "a game's dashboard", breakpoint: "lg", firstThings: ["sidebar search + tree", "game title", "sentiment summary"], pass: true, evidence: "screenshots/desktop-04-dashboard-sidebar.png" }

# Time estimates: an expert user, KLM-style (about 1.2s per point-and-tap plus reading).
taskTimes:
  - { task: "T1", seconds: 6, note: "phone: open drawer, tap MSN, scan" }
  - { task: "T2", seconds: 2 }
  - { task: "T3", seconds: 4, note: "open dropdown, pick" }
  - { task: "T4", seconds: 3 }
  - { task: "T5", seconds: 2, note: "one tap; later visits need 0 taps" }
  - { task: "T6", seconds: 5, note: "scan for '!' or tap Critical, then open" }
  - { task: "T7", seconds: 3 }
taskPaths:
  # Click counts match user-flow.yaml steps exactly (audit round 1).
  - { task: "T1", clicks: 3, path: "Browse & filter → MSN → a game (phone); 2 on desktop", pass: true }
  - { task: "T2", clicks: 1, path: "List", pass: true }
  - { task: "T3", clicks: 1, path: "Platform dropdown → MSN", pass: true }
  - { task: "T4", clicks: 1, path: "Active (desktop); 2 on phone via the drawer", pass: true }
  - { task: "T5", clicks: 1, path: "star beside a build's Continue (pinning is automatic)", pass: true }
  - { task: "T6", clicks: 2, path: "Critical → the game", pass: true }
  - { task: "T7", clicks: 1, path: "a game in the tree (desktop); 2 on phone", pass: true }

mobileCheck:
  designedPhoneFirst: true
  reflowAtMinViewport: { pass: true, evidence: "scrollWidth - innerWidth = 0 on /games (cards, list), /sessions, drawer open, at 320/390/1440 (measured)" }
  textScale200:
    pass: "partial"
    method: "320px viewport, root font-size 200%, full-page screenshots; count elements inside <main> whose box crosses the viewport, excluding horizontal scrollers"
    results:
      - { surface: "/games cards", overflowing: 0, evidence: "screenshots/phone320-text200-cards.png" }
      - { surface: "/games list", overflowing: 0, evidence: "screenshots/phone320-text200-list.png" }
      - { surface: "drawer open", overflowing: 0, evidence: "screenshots/phone320-text200-drawer.png" }
      - { surface: "/sessions", overflowing: 0, note: "The table scrolls sideways inside its own scroller (the existing table pattern).", evidence: "screenshots/phone320-text200-sessions.png" }
      - { surface: "dashboard", overflowing: 1, note: "'Re-analyze feedback' is GFE-SHELL's dashboard content. Flagged to its owner.", evidence: "screenshots/phone320-text200-dashboard.png" }
    note: "The site header (NavClient, GFE-SHELL) overflows by 54px at 200% on every page. It predates this work, so it is flagged to its owner in design-index.yaml." 
  noHoverOnly: true
  touchTargets: { pass: true, note: "All new controls >= 44px, including card and list-row actions and Archive (audit round 2 fix)." }
  thumbReach: "Drawer button top of list; reason: precedes what it filters."
  orientations: "Landscape = same layout."

acceptanceResults:
  - { id: "AC1", met: true, where: "Browse & filter → MSN; test games-page-filters 'picking a platform navigates with it…'; screenshots/phone-03-list-msn.png" }
  - { id: "AC2", met: true, where: "'switches view in one tap'; gamesHref keeps ?view=list ('keeps defaults out of the URL and adds filters + view when set')" }
  - { id: "AC3", met: true, where: "test_platform_filter_is_applied_before_pagination" }
  - { id: "AC4", met: true, where: "test_facet_counts_apply_the_other_facet_but_not_their_own; 'lists each option with its count…'" }
  - { id: "AC5", met: true, where: "'shows a removable chip per active filter…'; 'Clear filters drops every filter in one navigation'" }
  - { id: "AC6", met: true, where: "test_activity_sort_counts_recent_non_deleted_sessions; 'forwards sort=activity'" }
  - { id: "AC7", met: true, where: "test_sessions_platform_filter_narrows_items_and_total; sessions-filters-platform 'picking a platform clears game, build and page'" }
  - { id: "AC8", met: true, where: "Measured scrollWidth - innerWidth = 0 at 320px; drawer closed by default (screenshots/phone320-04-list.png, phone320-05-drawer.png)" }
  - { id: "AC9", met: true, where: "'names the filters that matched nothing and clears them, keeping the search (AC9)'" }
  - { id: "AC10", met: true, where: "'still renders the catalogue when the facets read fails (AC10)'" }
  - { id: "AC11", met: true, where: "StarButton in BuildPills and /sessions rows; test_build_star_is_private_idempotent_and_pins_the_game_first; test_sessions_on_starred_builds_are_pinned_first; test_cannot_star_a_build_outside_scope_or_under_the_wrong_game; screenshots desktop-00 (starred games and the starred Asteroids title group first) and desktop-05 (starred sessions first)" }
  - { id: "AC12", met: true, where: "has_critical (40%/5 confirmed); test_critical_means_overly_negative_reviews; test_critical_is_hidden_from_non_reviewers" }
  - { id: "AC13", met: true, where: "TitleGroup + tree; screenshots desktop-00/01" }
  - { id: "AC14", met: true, where: "CatalogShell on /games + dashboard; screenshot desktop-04" }

gapReports: ["component-gap-report.yaml"]
verificationReports: ["component-verification-reports.yaml"]
