# Step 10 — design output for GFE-SORT (Claude Code: the design is the code).
id: "GFE-SORT-design-1"
projectId: "GFE-SORT"
briefRef: "GFE-SORT"
scopeOverlapReportRef: "scope-overlap-report.yaml"
userFlowRef: "user-flow.yaml"
manifestVersion: "1.0.0"
artifact:
  kind: "code"
  repo: "Atari-Inc/atari-game-feedback-engine"
  branch: "design-agent/game-sort (local; delivered as ../implementation/game-sort.patch)"
  screenshots: "screenshots/ (390x844, 320x700, 1440x900; dev stack with seeded data)"

layout:
  phone: "Search, then sort + view pills (wrap), then a 'Filters (n)' toggle (aria-expanded). The panel opens INLINE above the results and pushes them down. Count line, then removable chips + 'Clear filters', then results."
  lg-and-up: "Two columns: 15rem filter column (always open) beside the results. Controls row: search left, sort + view right."
  cardView: "Unchanged row-subgrid grid (DESIGN_SYSTEM §3.10); slot 2 is now 'platform · studio · Added <date>'."
  listView: "One row per game: title (stretched link) + build badge + meta line; View dashboard / Import documents / Edit on the right from sm:, wrapped below on phones. No build pills, no admin management (card view keeps those)."

decisionLog:
  - { id: "D1", mode: "inherited", decision: "Filter, sort and view state live in the URL and navigate with router.replace inside one transition; the grid dims while pending.", source: "CH-606", tradeoff: "n/a (inherited)" }
  - { id: "D2", mode: "auto-applied", decision: "Phone panel is an inline disclosure, not an overlay drawer.", tradeoff: "Gains: no focus trap, no scroll lock, results still reachable, same markup at every width. Costs: long facet lists push results down (mitigated by 'Show all' after 8)." , note: "Author already chose 'collapsing left side window'; the drawer vs inline question was treated as a detail within that choice. Flag if you wanted an overlay." }
  - { id: "D3", mode: "auto-applied", decision: "Facets are multi-select toggle rows (aria-pressed) with counts, not <select>s.", tradeoff: "Gains: several platforms at once, counts visible (Wickens 9). Costs: a new component (gap report)." }
  - { id: "D4", mode: "auto-applied", decision: "Facet counts apply the other facet's selection, not their own.", tradeoff: "Standard faceted search; avoids a misleading 0 next to a second platform." }
  - { id: "D5", mode: "auto-applied", decision: "'Most active' = sessions in the last 30 days, placed on /games; the count line says so.", tradeoff: "Interpretation of 'sessions … sorted by most responses' — open question 4." }
  - { id: "D6", mode: "auto-applied", decision: "Studio is shown (panel + meta) only when the caller can see 2+ studios.", tradeoff: "Viewers are studio-scoped; one option filters nothing." }
  - { id: "D7", mode: "auto-applied", decision: "List view drops build pills and admin controls.", tradeoff: "Gains: scannable rows, no per-game builds reads. Costs: managing builds needs card view." }

glanceTest:
  breakpoint: "sm (390px)"
  firstThings: ["'Games' heading", "Search field", "Sort / view pills + 'Filters' toggle"]
  pass: true
  note: "Primary action per card (Continue) unchanged; the page's purpose line is unchanged."

taskPaths:
  - { task: "T1", clicks: 2, path: "Filters → MSN (phone); 1 on desktop (panel open)", minutes: 0.3, pass: true }
  - { task: "T2", clicks: 1, path: "List", minutes: 0.1, pass: true }
  - { task: "T3", clicks: 1, path: "Platform dropdown → MSN (/sessions)", minutes: 0.3, pass: true }

mobileCheck:
  designedPhoneFirst: true
  reflowAtMinViewport: { pass: true, evidence: "scrollWidth - innerWidth = 0 at 320, 390 and 1440 in all 10 screenshots" }
  textScale200: { pass: "unverified", note: "Rows use break-words and flex-wrap; not measured at 200% in this run." }
  noHoverOnly: true
  touchTargets: { pass: "partial", note: "All NEW controls ≥44px. Inherited Button size sm (≈28px) on card/list actions is a Fuji-wide issue, not introduced here." }
  thumbReach: "Filters toggle sits in the top third on phones; reason: it precedes the list it filters, same as the search field."
  safeAreasKeyboard: "No fixed/bottom elements added."
  orientations: "Landscape = same layout, scrolls."

acceptanceResults:
  - { id: "AC1", met: true, where: "GameFilterPanel + phone toggle; test game-filter-panel.test.tsx" }
  - { id: "AC2", met: true, where: "View pills, ?view=list; games-page-filters.test.tsx" }
  - { id: "AC3", met: true, where: "backend _apply_game_filters; test_platform_filter_is_applied_before_pagination" }
  - { id: "AC4", met: true, where: "GET /api/games/facets (DISTINCT platform)" }
  - { id: "AC5", met: true, where: "Active filters chips + Clear filters" }
  - { id: "AC6", met: true, where: "sort=activity; test_activity_sort_counts_recent_non_deleted_sessions" }
  - { id: "AC7", met: true, where: "SessionsFilters Platform + /api/sessions?platform=; test_sessions_platform_filter_narrows_items_and_total" }
  - { id: "AC8", met: true, where: "Screenshots phone320-*; new controls min-h 44px; panel collapsed by default" }
  - { id: "AC9", met: true, where: "NoMatchState with filters (screenshot desktop-04-no-match)" }
  - { id: "AC10", met: true, where: "FacetsState error branch + shape guard; games-page-filters.test.tsx" }

