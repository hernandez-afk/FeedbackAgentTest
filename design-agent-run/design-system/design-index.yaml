# Design index for the Game Feedback Engine (Fuji). GFE-SORT went through the
# full loop. Every page that shipped before the harness is registered by area
# as a backfill project (backfill: true), each with a standalone audit.
projects:
  - id: GFE-SHELL
    title: Site header, sign-in and root redirect
    status: shipped
    backfill: true
    scopeSummary: The header nav on every page, /login, and / (redirects to /games).
    scopeTerms:
    - nav
    - header
    - sign in
    surfaces:
    - nav
    - login
    priorities: []
    componentsUsed: []
    codePaths:
    - frontend/components/NavClient.tsx
    - frontend/app/layout.tsx
    - frontend/app/login/**
    - frontend/app/page.tsx
    artifacts:
    - id: audit-report-GFE-SHELL-standalone-1
      type: audit-report
      path: existing-pages/gfe-shell/audit-report-standalone-1.md
      version: 1
      reviewStatus: current
  - id: GFE-CAPTURE
    title: Tester capture flow
    status: shipped
    backfill: true
    scopeSummary: A tester opens /game/<slug>, reads the brief, plays, uploads a recording, answers the feedback questions, and sees the thank-you page.
    scopeTerms:
    - capture
    - tester
    - upload
    - feedback questions
    - how to play
    surfaces:
    - game
    - brief
    - upload
    - feedback
    - thankyou
    priorities: []
    componentsUsed: []
    codePaths:
    - frontend/app/game/**
    - frontend/app/brief/**
    - frontend/app/upload/**
    - frontend/app/feedback/**
    - frontend/app/thankyou/**
    artifacts:
    - id: audit-report-GFE-CAPTURE-standalone-1
      type: audit-report
      path: existing-pages/gfe-capture/audit-report-standalone-1.md
      version: 1
      reviewStatus: current
  - id: GFE-REVIEW
    title: Reviewer session detail
    status: shipped
    backfill: true
    scopeSummary: '/sessions/[id]: the video reviewer with an annotated timeline, and the session''s feedback entries.'
    scopeTerms:
    - session detail
    - video review
    - timeline
    surfaces:
    - sessions/detail
    priorities: []
    componentsUsed: []
    codePaths:
    - frontend/app/sessions/[id]/**
    artifacts:
    - id: audit-report-GFE-REVIEW-standalone-1
      type: audit-report
      path: existing-pages/gfe-review/audit-report-standalone-1.md
      version: 1
      reviewStatus: current
  - id: GFE-DASHBOARD
    title: Game feedback dashboard
    status: shipped
    backfill: true
    scopeSummary: '/games/[gameId]/dashboard: five tabs of sentiment, KPIs and themes per game.'
    scopeTerms:
    - dashboard
    - sentiment
    - kpi
    surfaces:
    - games/dashboard
    priorities: []
    componentsUsed: []
    codePaths:
    - frontend/app/games/[gameId]/dashboard/**
    - frontend/components/dashboard/**
    artifacts:
    - id: audit-report-GFE-DASHBOARD-standalone-1
      type: audit-report
      path: existing-pages/gfe-dashboard/audit-report-standalone-1.md
      version: 1
      reviewStatus: current
    flags:
    - GFE-SORT wraps this page in the catalogue sidebar (GFE-SORT scope-2, IC3)
    - 'The header says "Sentiment: Mixed" for a game at 55% negative, which GFE-SORT''s critical flag calls overly negative. The label and the flag should agree.'
  - id: GFE-CATALOG-ADMIN
    title: Add and edit games and builds
    status: shipped
    backfill: true
    scopeSummary: '/games/new, /games/[gameId]/edit and /builds/new: the admin forms.'
    scopeTerms:
    - add game
    - edit game
    - add build
    surfaces:
    - games/new
    - games/edit
    - builds/new
    priorities: []
    componentsUsed: []
    codePaths:
    - frontend/app/games/new/**
    - frontend/app/games/[gameId]/edit/**
    - frontend/app/builds/**
    artifacts:
    - id: audit-report-GFE-CATALOG-ADMIN-standalone-1
      type: audit-report
      path: existing-pages/gfe-catalog-admin/audit-report-standalone-1.md
      version: 1
      reviewStatus: current
  - id: GFE-IMPORTS
    title: Import write-ups
    status: shipped
    backfill: true
    scopeSummary: '/imports and /games/[gameId]/imports: producers upload written feedback documents and see earlier imports.'
    scopeTerms:
    - import
    - write-up
    - document upload
    surfaces:
    - imports
    - games/imports
    priorities: []
    componentsUsed: []
    codePaths:
    - frontend/app/imports/**
    - frontend/app/games/[gameId]/imports/**
    artifacts:
    - id: audit-report-GFE-IMPORTS-standalone-1
      type: audit-report
      path: existing-pages/gfe-imports/audit-report-standalone-1.md
      version: 1
      reviewStatus: current
  - id: GFE-ADMIN
    title: Admin console
    status: shipped
    backfill: true
    scopeSummary: /admin (users and roles) and /admin/questions (authoring questions and suppressions).
    scopeTerms:
    - admin
    - users
    - questions
    surfaces:
    - admin
    - admin/questions
    priorities: []
    componentsUsed: []
    codePaths:
    - frontend/app/admin/**
    artifacts:
    - id: audit-report-GFE-ADMIN-standalone-1
      type: audit-report
      path: existing-pages/gfe-admin/audit-report-standalone-1.md
      version: 1
      reviewStatus: current
  - id: "GFE-SORT"
    title: "Browse, filter and sort games and sessions"
    status: "in-progress"  # round 3 audited (audit-report-round3.md); waiting on human sign-off
    scopeSummary: "The catalogue sidebar (search, sort, Platform/Project/Studio filters, Project → Platform → Title tree) on /games and every game dashboard; card/list view; title groups; build stars pinned first on /games and /sessions; the negative-reviews warning; a platform filter on /sessions."
    scopeTerms: ["game catalogue", "platform filter", "studio filter", "sort order", "list view", "session sort", "project", "title", "favourite", "critical warning", "sidebar tree"]
    surfaces: ["games", "games/filters", "sessions", "sessions/filters", "catalog-sidebar"]
    priorities:
      - { id: "P1", statement: "Anyone can narrow a long list of games or sessions to the platform, studio or game they're looking for." }
      - { id: "P2", statement: "Filtering keeps working as the catalogue grows past one screenful (server-side, paginated, new facet values appear without code changes)." }
      - { id: "P3", statement: "A first-time user can use it with no instructions (3-3-3)." }
    componentsUsed: ["GameCard", "SortPillGroup", "NativeSelect", "EmptyState", "InlineError", "Badge", "Card", "Button", "GameFilterPanel (proposed)", "GameListRow (proposed)", "CatalogShell (proposed)", "CatalogTree (proposed)", "SortButtons (proposed)", "StarButton (proposed)", "CriticalFlag (proposed)", "TitleGroup (proposed)", "GroupingFields (proposed)", "DashboardSidebar (proposed)", "BuildPills"]
    codePaths:
      - "frontend/app/games/page.tsx"
      - "frontend/components/GamesCatalogBrowser.tsx"
      - "frontend/components/GameFilterPanel.tsx"
      - "frontend/components/GameListRow.tsx"
      - "frontend/components/SessionsFilters.tsx"
      - "frontend/app/sessions/page.tsx"
      - "frontend/lib/game-search.ts"
      - "frontend/components/catalog/**"
      - "frontend/lib/title-groups.ts"
      - "frontend/lib/game-meta.ts"
      - "frontend/components/BuildPills.tsx"
      - "frontend/lib/pill-classes.ts"
      - "backend/games.py"
      - "backend/sessions.py"
      - "backend/models.py"
    artifacts:
      - { id: "GFE-SORT-page-brief", type: "page-brief", path: "game-sort/page-brief.md", version: 3, reviewStatus: "current" }
      - { id: "GFE-SORT-brief", type: "ticket-brief", path: "game-sort/ticket-brief.yaml", version: 3, reviewStatus: "current" }
      - { id: "GFE-SORT-brief-report", type: "brief-optimization-report", path: "game-sort/brief-optimization-report.yaml", version: 3, reviewStatus: "current" }
      - { id: "GFE-SORT-scope-2", type: "scope-overlap-report", path: "game-sort/scope-overlap-report.yaml", version: 2, reviewStatus: "current" }
      - { id: "GFE-SORT-flow-3", type: "user-flow", path: "game-sort/user-flow.yaml", version: 3, reviewStatus: "current" }
      - { id: "GFE-SORT-gap-3", type: "component-gap-report", path: "game-sort/component-gap-report.yaml", version: 3, reviewStatus: "current" }
      - { id: "GFE-SORT-verification", type: "component-verification-report", path: "game-sort/component-verification-reports.yaml", version: 3, reviewStatus: "current" }
      - { id: "GFE-SORT-design-3", type: "design-output", path: "game-sort/design-output.yaml", version: 3, reviewStatus: "current" }
      - { id: "audit-report-GFE-SORT-round1", type: "audit-report", path: "game-sort/audit-report-round1.md", version: 1, reviewStatus: "current" }
      - { id: "audit-report-GFE-SORT-round2", type: "audit-report", path: "game-sort/audit-report-round2.md", version: 2, reviewStatus: "current" }
      - { id: "audit-report-GFE-SORT-round3", type: "audit-report", path: "game-sort/audit-report-round3.md", version: 3, reviewStatus: "current" }
navigation:
  links:
    - { from: "nav", to: "games", label: "Games", kind: "nav", status: "live" }
    - { from: "nav", to: "sessions", label: "Sessions", kind: "nav", status: "live" }
    - { from: "games", to: "game", label: "card title / list row", kind: "nav", status: "live" }
    - { from: "sessions", to: "sessions/detail", label: "View", kind: "nav", status: "live" }
    - { from: "catalog-sidebar", to: "games/dashboard", label: "a game in the sidebar tree (reviewers)", kind: "nav", projectId: "GFE-SORT", status: "live" }
    - { from: "games/dashboard", to: "games", label: "All games", kind: "back", status: "live" }
    - { from: "email", to: "game", label: "shared /game/<slug> link", kind: "deep-link", status: "live" }
    - { from: "login", to: "games", label: "sign in (returns to ?from)", kind: "redirect", status: "live" }
